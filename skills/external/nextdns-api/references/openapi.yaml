  # ---- Analytics (each also supports a `;series` path suffix for time-series — see below and api-reference.md) ----
  /profiles/{profile}/analytics/status:
    parameters: [{ $ref: '#/components/parameters/profileId' }, { $ref: '#/components/parameters/from' }, { $ref: '#/components/parameters/to' }, { $ref: '#/components/parameters/limit' }, { $ref: '#/components/parameters/cursor' }, { $ref: '#/components/parameters/device' }]
    get:
      tags: [Analytics]
      summary: Query counts by status (default/blocked/allowed)
      operationId: getAnalyticsStatus
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { data: { type: array, items: { $ref: '#/components/schemas/AnalyticsStatusRow' } } }
              examples:
                default: { $ref: '#/components/examples/AnalyticsStatusExample' }

  /profiles/{profile}/analytics/domains:
    parameters:
      - { $ref: '#/components/parameters/profileId' }
