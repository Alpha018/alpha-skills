  /profiles/{profile}/analytics/destinations:
    parameters:
      - { $ref: '#/components/parameters/profileId' }
      - { $ref: '#/components/parameters/from' }
      - { $ref: '#/components/parameters/to' }
      - { $ref: '#/components/parameters/device' }
      - name: type
        in: query
        required: true
        schema: { type: string, enum: [countries, gafam] }
    get:
      tags: [Analytics]
      summary: Query destinations grouped by country or GAFAM company
      operationId: getAnalyticsDestinations
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      oneOf:
                        - $ref: '#/components/schemas/AnalyticsDestinationCountryRow'
                        - $ref: '#/components/schemas/AnalyticsDestinationGafamRow'
              examples:
                countries: { $ref: '#/components/examples/AnalyticsDestinationsCountriesExample' }
                gafam: { $ref: '#/components/examples/AnalyticsDestinationsGafamExample' }

  /profiles/{profile}/analytics/{dimension};series:
    parameters:
      - { $ref: '#/components/parameters/profileId' }
      - name: dimension
        in: path
        required: true
        schema: { type: string }
        description: Any analytics dimension name (status, domains, reasons, ips, devices, protocols, queryTypes, ipVersions, dnssec, encryption, destinations).
      - { $ref: '#/components/parameters/from' }
      - { $ref: '#/components/parameters/to' }
      - { $ref: '#/components/parameters/seriesInterval' }
      - { $ref: '#/components/parameters/seriesAlignment' }
      - { $ref: '#/components/parameters/seriesTimezone' }
      - { $ref: '#/components/parameters/seriesPartials' }
    get:
      tags: [Analytics]
      summary: Time-series variant of any analytics dimension
      description: >
        Append `;series` to any analytics path to get the dimension broken
        into time buckets instead of one total. `data[].queries` becomes a
        parallel array aligned to `meta.series.times`.
      operationId: getAnalyticsSeries
      responses:
        '200':
          description: OK
          content:
            application/json:
              examples:
                default: { $ref: '#/components/examples/TimeSeriesExample' }

  # ---- Logs ----
  /profiles/{profile}/logs:
    parameters:
      - { $ref: '#/components/parameters/profileId' }
      - { $ref: '#/components/parameters/from' }
      - { $ref: '#/components/parameters/to' }
      - name: sort
        in: query
        schema: { type: string, enum: [asc, desc], default: desc }
      - { $ref: '#/components/parameters/limit' }
      - { $ref: '#/components/parameters/cursor' }
      - { $ref: '#/components/parameters/device' }
      - name: status
        in: query
        schema: { type: string, enum: [default, error, blocked, allowed] }
      - name: search
        in: query
        schema: { type: string }
        description: Partial domain-name match.
      - name: raw
        in: query
        schema: { type: boolean, default: false }
        description: "`true` returns every DNS query; `false` returns deduplicated navigational queries only."
    get:
      tags: [Logs]
      summary: List DNS query logs
      operationId: listLogs
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DataEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/LogEntry' }
              examples:
                default: { $ref: '#/components/examples/LogsListExample' }
    delete:
      tags: [Logs]
      summary: Clear all logs for the profile
      operationId: clearLogs
      responses: { '200': { description: OK } }

  /profiles/{profile}/logs/stream:
    parameters:
      - { $ref: '#/components/parameters/profileId' }
      - { $ref: '#/components/parameters/device' }
      - name: status
        in: query
        schema: { type: string }
      - name: search
        in: query
        schema: { type: string }
      - name: raw
        in: query
        schema: { type: boolean, default: false }
      - name: id
        in: query
        schema: { type: string }
        description: Resume streaming from this event ID after a disconnect.
    get:
      tags: [Logs]
      summary: Stream DNS query logs in real time (Server-Sent Events)
      description: |
        Does not support `from`/`to`/`sort`/`limit`/`cursor` — this is a live
        tail, not a page. Standard SSE framing:

        ```
        id: 64v32d9r6rwkcctg6cu38e9g60
        data: {"timestamp":"2021-03-16T04:40:30.344Z","domain":"g.whatsapp.net",...}
        ```
      operationId: streamLogs
      responses:
        '200':
          description: text/event-stream of LogEntry objects, one per SSE `data:` line.
          content:
            text/event-stream: {}

  /profiles/{profile}/logs/download:
    parameters:
      - { $ref: '#/components/parameters/profileId' }
      - name: redirect
        in: query
        schema: { type: boolean, default: true }
        description: "`true` (default) issues a 302 straight to the file; `false` returns JSON with the URL instead."
    get:
      tags: [Logs]
      summary: Download logs as a file (redirects to a signed URL by default)
      operationId: downloadLogs
      responses:
        '200':
          description: "With redirect=false: JSON containing the file URL. Otherwise: HTTP 302 redirect."
          content:
            application/json:
              examples:
                default: { $ref: '#/components/examples/LogsDownloadUrlExample' }
