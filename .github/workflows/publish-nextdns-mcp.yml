name: Publish nextdns-mcp

on:
  push:
    tags:
      - "nextdns-mcp-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-servers/nextdns
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1, ahead of setup-node's bundled version.
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm run build

      # No NPM_TOKEN: npm exchanges the OIDC token from id-token: write above.
      - run: npm publish --provenance
