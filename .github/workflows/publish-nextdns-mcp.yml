name: Publish nextdns-mcp

on:
  workflow_run:
    workflows: [Release nextdns-mcp]
    types: [completed]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-servers/nextdns
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@latest

      - run: npm ci

      - id: version
        run: |
          echo "local=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "published=$(npm view @alpha018/nextdns-mcp version 2>/dev/null || echo none)" >> "$GITHUB_OUTPUT"

      - if: steps.version.outputs.local != steps.version.outputs.published
        run: npm run build

      - if: steps.version.outputs.local != steps.version.outputs.published
        run: npm publish --provenance
