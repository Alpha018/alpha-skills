name: Release nextdns-mcp

on:
  push:
    branches: [main]
    paths:
      - "mcp-servers/nextdns/**"
      - ".github/workflows/release-nextdns-mcp.yml"

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-servers/nextdns
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs npm >= 11.5.1; setup-node's bundled
      # npm can lag behind that.
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm run build
      - run: npm test

      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
