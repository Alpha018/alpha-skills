name: Release nextdns-mcp

on:
  push:
    branches: [main]
    paths:
      - "mcp-servers/nextdns/**"
      - ".github/workflows/release-nextdns-mcp.yml"

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-servers/nextdns
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm run build
      - run: npm test

      # npmPublish is disabled in .releaserc.json: this job only bumps the
      # version, writes the changelog, tags, and cuts the GitHub release.
      # publish-nextdns-mcp.yml does the actual npm publish, triggered by
      # the tag this step pushes.
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
